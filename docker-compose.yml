version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # El nombre del servicio funciona como hostname dentro de la red de Compose.
      - MONGO_URI=mongodb://mongo:27017/pokedex_db
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      # Conserva la base al detener o recrear el contenedor.
      - mongo_data:/data/db

volumes:
  mongo_data: